<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dochádzka – administrácia</title>
<meta name="theme-color" content="#1B1F1D">
<link rel="icon" href="../icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Správa">
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<link rel="stylesheet" href="../vendor/leaflet-1.9.4/leaflet.css">
<style>
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --sunk:#F5F6F3; --ink:#1B1F1D; --muted:#5C635E; --line:#D3D7D1;
  --accent:#F2B705; --accent-ink:#1B1F1D; --go:#1E7F4F; --stop:#B8322A; --flag:#D12A1F; --warn:#B86E00; --info:#2F5D8A;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121513; --surface:#1C201D; --sunk:#171A18; --ink:#EEF0EC; --muted:#9AA29C; --line:#2E3430;
  --accent:#F5C02A; --accent-ink:#121513; --go:#2C9A63; --stop:#D4483A; --flag:#FF5A4E; --warn:#E59A2F; --info:#7FB0E0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121513; --surface:#1C201D; --sunk:#171A18; --ink:#EEF0EC; --muted:#9AA29C; --line:#2E3430;
  --accent:#F5C02A; --accent-ink:#121513; --go:#2C9A63; --stop:#D4483A; --flag:#FF5A4E; --warn:#E59A2F; --info:#7FB0E0; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
a{color:var(--info)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.muted{color:var(--muted)} .small{font-size:13px}

/* rozloženie */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--ink);color:var(--bg);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
nav .brand{font-family:var(--display);font-weight:700;font-size:22px;padding:4px 10px 2px}
nav .firm{font-size:13px;opacity:.7;padding:0 10px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav a{color:inherit;text-decoration:none;padding:9px 12px;border-radius:10px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
nav a:hover{background:rgba(255,255,255,.08)}
nav a.on{background:var(--accent);color:var(--accent-ink)}
nav .cnt{font-size:12px;background:var(--flag);color:#fff;border-radius:999px;padding:0 7px;font-weight:600}
nav .grow{flex:1}
nav .me{font-size:13px;opacity:.7;padding:8px 10px;word-break:break-all}
main{padding:22px 28px 60px;min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h1{flex:1}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}
  nav .brand{width:100%} nav .firm,nav .grow,nav .me{display:none}
  main{padding:16px}
}

/* prvky */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .l{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
.btn{min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{color:var(--ink);text-decoration:none;justify-content:center}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--stop);border-color:var(--stop)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field select,.field textarea,.bar input,.bar select{min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);padding:6px 10px}
.field textarea{min-height:70px;resize:vertical}
.bar input[type=checkbox]{min-height:0;padding:0}
.field .hint{font-size:13px;color:var(--muted)}
.form{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
@media (max-width:600px){.form{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--go)}
.check b{display:block}
.check span{color:var(--muted);font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.go{color:var(--go);border-color:currentColor;background:transparent}
.tag.warn{color:var(--warn);border-color:currentColor;background:transparent}
.tag.flag{color:var(--flag);border-color:currentColor;background:transparent}
.flag{color:var(--flag);font-weight:700}
.warnc{color:var(--warn)}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* tabuľky */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-top:0;background:var(--sunk);white-space:nowrap}
td.r,th.r{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.edited td:first-child{box-shadow:inset 4px 0 0 var(--flag)}
tr.sub td{background:var(--sunk);font-size:14px}
tfoot td{font-weight:700;background:var(--sunk)}
.orig{color:var(--flag);font-size:12px;display:block}
.excl{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--flag);color:#fff;font-weight:700;font-size:13px;margin-right:4px;vertical-align:-3px}

/* živý prehľad */
.live{display:flex;flex-direction:column;gap:6px}
.live .who{font-weight:600;font-size:17px}
.live .since{font-family:var(--display);font-size:22px;font-weight:600}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--go);margin-right:6px}
.meter{height:8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--go)}
.meter.warn i{background:var(--warn)} .meter.over i{background:var(--flag)}
.map{height:340px;border-radius:12px;border:1px solid var(--line);z-index:0}
.code{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.12em;background:var(--sunk);border:1px dashed var(--line);border-radius:12px;padding:6px 14px;display:inline-block}

/* okno */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:640px;display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{flex:1}
.modal .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .grow{flex:1}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:2000;font-weight:600;max-width:90%;text-align:center}
.toast.err{background:var(--stop);color:#fff}

/* prihlásenie */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth .card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;padding:24px}
.tabs{display:flex;gap:6px;background:var(--sunk);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.print-only{display:none}
/* kto je kde – podľa zákaziek */
.hero{background:var(--ink);color:var(--bg);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero .top{display:flex;align-items:flex-end;gap:10px}
.hero .top .grow{flex:1}
.hero .sub{font-size:13px;opacity:.75}
.hero h1{font-size:30px;line-height:1.05}
.counts{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr))}
.counts>a,.counts>div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;color:inherit;text-decoration:none}
.counts .l{font-size:12px;opacity:.75;line-height:1.2}
.counts .s{font-size:12px;opacity:.85;white-space:nowrap}
.counts .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.counts .go{color:#6fd39f} .counts .fl{color:#ff8a80} .counts .or{color:#ffb74d}
.alerts{background:color-mix(in srgb,var(--flag) 8%,var(--surface));border:2px solid var(--flag);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.alerts .dot{flex:none;width:22px;height:22px;border-radius:50%;background:var(--flag);color:#fff;font-weight:700;display:grid;place-items:center}
.alerts ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.alerts button.lnk{border:0;background:none;padding:0;color:var(--info);text-decoration:underline;font-weight:600}
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));align-items:start}
@media (max-width:420px){.pgrid{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pcard .ph{display:flex;flex-direction:column;gap:8px;padding:12px 14px 10px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.pcard .ph:hover{background:var(--sunk)}
.pcard .pn{display:flex;align-items:baseline;gap:8px}
.pcard .pn b{flex:1;font-family:var(--display);font-size:22px;line-height:1.1}
.pcard .bud{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.pcard .bud .meter{flex:1}
.person{display:flex;align-items:center;gap:12px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.person:hover{background:var(--sunk)}
.person .tn{flex:none;min-width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:20px;display:grid;place-items:center}
.person .mid{flex:1;min-width:0}
.person .nm{font-weight:600;font-size:16px}
.person .wh{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .rt{text-align:right;flex:none}
.person .hrs{font-family:var(--display);font-weight:600;font-size:19px}
.money{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:0 7px;color:#fff;background:var(--warn);margin-left:4px;vertical-align:1px}
.money.late{background:var(--flag)}
.left{padding:8px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
details.card summary{font-weight:600;cursor:pointer}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.thumbs{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.pos{color:var(--go)} .neg{color:var(--flag)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.citem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.citem.late{border:2px solid var(--flag)} .citem.rep{border:2px solid var(--warn)}
.citem .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.citem .top b{flex:1}
.citem .amt{font-family:var(--display);font-size:22px;font-weight:700}
.bignum{font-family:var(--display);font-size:26px;font-weight:700}
.sheetbtns{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.sheetbtns .btn{min-height:52px;justify-content:center;font-size:16px}

/* spodná lišta a menu v mobile */
.tabbar{display:none}
.menu a{min-height:54px;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);font-size:17px;font-weight:600}
.menu a span:first-child{flex:1}
.menu .cnt{flex:none;font-size:12px;background:var(--flag);color:#fff;border-radius:999px;padding:1px 8px}
.menu .cnt.or{background:var(--warn)}
.menu .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:10px}
.menu .tiles a{min-height:64px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);flex-direction:column;justify-content:center;gap:2px;font-size:14px}
.menu .tiles b{font-family:var(--display);font-size:20px}
@media (max-width:860px){
  nav{display:none}
  main{padding:12px 12px 90px}
  .tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:900;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px;position:relative}
  .tabbar a.on{color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
  .tabbar .cnt{position:absolute;top:6px;left:calc(50% + 6px);font-size:11px;background:var(--warn);color:#fff;border-radius:999px;padding:0 6px;font-weight:700}
  .hero{margin:-12px -12px 0;border-radius:0}
  .scrim{align-items:flex-end;padding:0}
  .modal{border-radius:20px 20px 0 0;max-height:94vh;overflow:auto}
  .modal header{position:sticky;top:0;background:var(--surface);z-index:2}
  .modal footer{position:sticky;bottom:0;background:var(--surface)}
  .head h1{font-size:26px}
}
/* tabuľky ako karty v mobile */
@media (max-width:700px){
  .tablewrap{background:none;border:0;overflow:visible}
  .tablewrap table,.tablewrap tbody,.tablewrap tfoot{display:block}
  .tablewrap thead{display:none}
  .tablewrap tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:8px}
  .tablewrap tr.sub{margin:-6px 0 8px 14px;padding:4px 10px}
  .tablewrap td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 0;text-align:right}
  .tablewrap td:first-child{text-align:left;justify-content:flex-start;font-size:16px}
  .tablewrap td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:13px;text-align:left;font-weight:400}
  .tablewrap td:empty{display:none}
  .tablewrap td.empty{justify-content:center}
  tr.edited td:first-child{box-shadow:none} tr.edited{border-left:4px solid var(--flag)!important}
}
@media print{
  nav,.tabbar,.noprint,.btn,.bar{display:none!important}
  .shell{display:block} main{padding:0}
  .print-only{display:block}
  body{background:#fff;color:#000;font-size:11px}
  .tablewrap,.card{border:0}
  th{background:#eee!important}
  tr.sub{display:table-row!important}
}
</style>
</head>
<body>
<div id="auth" class="auth" hidden></div>
<div id="shell" class="shell" hidden>
  <nav id="nav"></nav>
  <main id="main"></main>
  <div class="tabbar" id="tabbar"></div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="../config.js"></script>
<script src="../vendor/supabase-2.117.2.js"></script>
<script src="../vendor/leaflet-1.9.4/leaflet.js"></script>
<script src="../vendor/xlsx-0.18.5.mini.min.js"></script>
<script>
/* =====================================================================
   ZÁKLAD
   ===================================================================== */
const CFG = window.DOCHADZKA;
const sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
const WORKER_APP = new URL("../", location.href).href;   // appka pracovníka

const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ms = v => v == null ? null : (typeof v === "number" ? v : Date.parse(v));
const pad = n => String(n).padStart(2, "0");
const hm = v => { const d = new Date(ms(v)); return d.getHours() + ":" + pad(d.getMinutes()); };
const dShort = v => new Date(ms(v)).toLocaleDateString("sk-SK", {weekday:"short", day:"numeric", month:"numeric"});
const dFull = v => new Date(ms(v)).toLocaleDateString("sk-SK");
const hhmm = t => { const m = Math.round(t / 60000); return Math.floor(m / 60) + ":" + pad(m % 60); };
const hoursDec = t => Math.round(t / 36e3) / 100;
const eur = n => new Intl.NumberFormat("sk-SK", {style:"currency", currency:"EUR"}).format(n || 0);
const dateKey = v => { const d = new Date(ms(v)); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const timeVal = v => { const d = new Date(ms(v)); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const KIND = {dovolenka:"Dovolenka", PN:"PN", volno:"Voľno"};

function toast(t, err) {
  const el = $("#toast"); el.textContent = t; el.className = "toast" + (err ? " err" : ""); el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, err ? 5000 : 2600);
}
function errMsg(e) {
  const m = e && (e.message || e.error_description || String(e));
  if (/Invalid login credentials/i.test(m)) return "Nesprávny e-mail alebo heslo";
  if (/Email not confirmed/i.test(m)) return "E-mail ešte nie je potvrdený – klikni na odkaz v e-maile";
  if (/already registered/i.test(m)) return "Tento e-mail je už registrovaný – prihlás sa";
  if (/Password should be/i.test(m)) return "Heslo musí mať aspoň 6 znakov";
  if (/duplicate key.*tasks_pkey/i.test(m)) return "Úloha s týmto číslom už existuje";
  if (/(advances|cash_items)_worker_id_fkey/i.test(m)) return "Pracovník má zálohy alebo hotovosť – nedá sa zmazať, označ ho ako neaktívneho";
  if (/entries_worker_id_fkey/i.test(m)) return "Pracovník má záznamy dochádzky – nedá sa zmazať, označ ho ako neaktívneho";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Bez pripojenia na server";
  return m;
}
async function q(p) { const {data, error} = await p; if (error) throw error; return data; }
// Supabase vracia max. 1000 riadkov naraz – stránkujeme
async function fetchAll(make) {
  const out = []; const N = 1000;
  for (let i = 0; ; i += N) { const d = await q(make().range(i, i + N - 1)); out.push(...d); if (d.length < N) break; }
  return out;
}

/* =====================================================================
   DÁTA
   ===================================================================== */
let USER = null, C = null, W = [], P = [], T = [], R = [], A = [], ADV = [], CASH = [];
const worker = id => W.find(w => w.id === id);
const project = id => P.find(p => p.id === id);
const taskName = n => (T.find(t => t.num === n) || {}).name || ("Úloha " + n);
const projName = e => e.project_id ? (project(e.project_id)?.name || "?") : ("Iné" + (e.other_text ? ": " + e.other_text : ""));
const wName = id => worker(id)?.name || "?";

function workedMs(e, now = Date.now()) {
  const end = ms(e.end_at) ?? now; let t = end - ms(e.start_at);
  (e.breaks || []).forEach(b => { t -= ((b.end ?? now) - b.start); });
  return Math.max(0, t);
}
// Sadzba: najkonkrétnejšie pravidlo vyhráva (úloha 4 > zákazka 2 > pracovník 1), potom sadzba pracovníka, potom firmy
function rateFor(e) {
  let best = null, bs = -1;
  for (const r of R) {
    if (r.worker_id && r.worker_id !== e.worker_id) continue;
    if (r.project_id && r.project_id !== e.project_id) continue;
    if (r.task_num != null && r.task_num !== e.task_num) continue;
    const s = (r.task_num != null ? 4 : 0) + (r.project_id ? 2 : 0) + (r.worker_id ? 1 : 0);
    if (s > bs) { bs = s; best = r; }
  }
  if (best) return +best.rate;
  const w = worker(e.worker_id);
  return w && w.hourly_rate != null ? +w.hourly_rate : +(C.default_rate || 0);
}
const costOf = e => workedMs(e) / 36e5 * rateFor(e);

async function loadBase() {
  const cid = await q(sb.rpc("my_admin_company"));
  if (!cid) { C = null; return; }
  [C, W, P, T, R, A] = await Promise.all([
    q(sb.from("companies").select("*").eq("id", cid).single()),
    q(sb.from("workers").select("*").eq("company_id", cid).order("name")),
    q(sb.from("projects").select("*").eq("company_id", cid).order("name")),
    q(sb.from("tasks").select("*").eq("company_id", cid).order("num")),
    q(sb.from("rates").select("*").eq("company_id", cid).order("created_at")),
    q(sb.from("absences").select("*").eq("company_id", cid).order("date_from", {ascending:false}))
  ]);
  await loadMoney();
}
async function loadMoney() {
  [ADV, CASH] = await Promise.all([
    fetchAll(() => sb.from("advances").select("*").eq("company_id", C.id).order("paid_on", {ascending:false})),
    fetchAll(() => sb.from("cash_items").select("*").eq("company_id", C.id).order("issued_at", {ascending:false}))
  ]);
}

/* ---------- peniaze: zálohy, hotovosť, vyúčtovanie ---------- */
const ymOf = v => dateKey(v).slice(0, 7);
const r2 = n => Math.round((parseFloat(String(n ?? "").replace(",", ".")) || 0) * 100) / 100;
const cashOpen = c => c.status !== "done";
// hotovosť u pracovníka bez dokladu (pohľadávka) – vydaná, ešte nevybavená
const cashOwed = c => c.kind === "issued" && cashOpen(c) ? +c.given : 0;
// po lehote: dal som hotovosť a doklad neprišiel (alebo som ho vrátil na opravu)
const cashLate = c => c.kind === "issued" && (c.status === "open" || c.status === "returned") && Date.now() - ms(c.issued_at) > (C.cash_overdue_days ?? 3) * 864e5;
// vplyv na výplatu: + doplatiť pracovníkovi, − strhnúť
const cashPay = c => c.status === "done" && c.settle_mode === "payroll" ? r2((+c.spent || 0) - (+c.given || 0)) : 0;
function cashSummary(wid) {
  const l = CASH.filter(c => (!wid || c.worker_id === wid) && cashOwed(c));
  return {n: l.length, sum: l.reduce((a, c) => a + +c.given, 0), late: l.some(cashLate), toCheck: CASH.filter(c => (!wid || c.worker_id === wid) && c.status === "reported").length};
}
const moneyBadge = wid => { const s = cashSummary(wid); return s.n ? `<span class="money ${s.late ? "late" : ""}" title="Hotovosť bez dokladu">${eur(s.sum)}</span>` : ""; };
// vyúčtovanie mesiaca: cena práce − zálohy ± hotovosť + prenesený mínus z minulých mesiacov
async function payroll(ym) {
  const months = new Set(ADV.map(a => a.paid_on.slice(0, 7)).concat(CASH.filter(cashPay).map(c => ymOf(c.settled_at))));
  const first = [...months].filter(m => m < ym).sort()[0];
  const cur = ym === cache.range ? cache.entries : await loadEntries(...monthRange(ym));
  const prev = first ? await fetchAll(() => sb.from("entries").select("worker_id,project_id,task_num,start_at,end_at,breaks").eq("company_id", C.id)
    .gte("start_at", monthRange(first)[0].toISOString()).lt("start_at", monthRange(ym)[0].toISOString()).order("start_at")) : [];
  const sum = (arr, f) => { const m = {}; arr.forEach(x => { const k = f(x); if (k) m[k[0]] = (m[k[0]] || 0) + k[1]; }); return m; };
  const labor = {}; prev.concat(cur).forEach(e => { const k = ymOf(e.start_at) + "|" + e.worker_id; labor[k] = (labor[k] || 0) + costOf(e); });
  const adv = sum(ADV, a => [a.paid_on.slice(0, 7) + "|" + a.worker_id, +a.amount]);
  const cash = sum(CASH, c => cashPay(c) ? [ymOf(c.settled_at) + "|" + c.worker_id, cashPay(c)] : null);
  const data = {};
  W.forEach(w => {
    let carry = 0;
    if (first) for (let d = new Date(monthRange(first)[0]); ymOf(d) < ym; d.setMonth(d.getMonth() + 1)) {
      const k = ymOf(d) + "|" + w.id;
      carry = Math.min(0, r2((labor[k] || 0) + (cash[k] || 0) - (adv[k] || 0) + carry));
    }
    const k = ym + "|" + w.id;
    const o = {labor: r2(labor[k]), adv: r2(adv[k]), cash: r2(cash[k]), carry};
    o.pay = r2(o.labor + o.cash - o.adv + o.carry);
    data[w.id] = o;
  });
  return data;
}
function monthRange(ym) {
  const [y, m] = ym.split("-").map(Number);
  return [new Date(y, m - 1, 1), new Date(y, m, 1)];
}
const curMonth = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
async function loadEntries(from, to) {
  return fetchAll(() => sb.from("entries").select("*").eq("company_id", C.id)
    .gte("start_at", from.toISOString()).lt("start_at", to.toISOString()).order("start_at"));
}
// celé čerpanie zákaziek s rozpočtom (od začiatku)
async function loadBudgetUse() {
  const ids = P.filter(p => p.budget).map(p => p.id);
  const use = {};
  if (!ids.length) return use;
  const rows = await fetchAll(() => sb.from("entries").select("worker_id,project_id,task_num,start_at,end_at,breaks").in("project_id", ids).order("start_at"));
  rows.forEach(e => { use[e.project_id] = (use[e.project_id] || 0) + costOf(e); });
  return use;
}
function budgetState(p, used) {
  if (!p.budget) return null;
  const pct = used / p.budget * 100;
  return {pct, cls: pct >= 100 ? "over" : pct >= C.budget_warn_pct ? "warn" : ""};
}
function distM(a, b) {
  const R0 = 6371000, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R0 * Math.asin(Math.sqrt(x));
}
const fmtDist = m => m < 1000 ? Math.round(m / 10) * 10 + " m" : (m / 1000).toFixed(1).replace(".", ",") + " km";
// poloha pri príchode vs. bod zákazky
function gpsTag(e) {
  const g = e.gps_start; if (!g) return "";
  // súradnice po lehote zmazané – ostal len výsledok kontroly
  if (g.lat == null) return g.on_site === true ? `<span class="tag go" title="Príchod na mieste zákazky (súradnice zmazané po lehote)">GPS ✓</span>`
    : g.on_site === false ? `<span class="tag warn" title="Súradnice zmazané po lehote">GPS ${fmtDist(g.dist)} od stavby</span>` : `<span class="tag" title="Súradnice zmazané po lehote">GPS</span>`;
  const p = project(e.project_id);
  const link = `https://www.openstreetmap.org/?mlat=${g.lat}&mlon=${g.lng}#map=17/${g.lat}/${g.lng}`;
  if (p && p.lat != null) {
    const d = distM(g, p), rad = p.radius || C.default_radius;
    return d <= rad ? `<a class="tag go" href="${link}" target="_blank" rel="noopener" title="Príchod na mieste zákazky">GPS ✓</a>`
                    : `<a class="tag warn" href="${link}" target="_blank" rel="noopener" title="Príchod mimo okruhu zákazky">GPS ${fmtDist(d)} od stavby</a>`;
  }
  return `<a class="tag" href="${link}" target="_blank" rel="noopener">GPS</a>`;
}

async function doLogin(f) {

    const d = await q(sb.auth.signInWithPassword({email: f.fEmail.value.trim(), password: f.fPass.value}));

  } catch (e) { renderAuth({t: errMsg(e), err: true}); }
}
async function doSignup(f) {
  const name = f.fCompany.value.trim();
  try {
    localStorage.setItem("dochadzka.pendingCompany", name);

/* =====================================================================
   PREHĽAD – kto je kde, upozornenia
   ===================================================================== */
let liveMap = null, liveTimer = null, live = {open: [], today: []};
const gpsState = e => {
  if (!C.gps_enabled) return null;
  if (!e.gps_start) return {t: "bez GPS", c: "muted"};
  if (e.gps_start.lat == null) return e.gps_start.on_site === false ? {t: fmtDist(e.gps_start.dist) + " od stavby", c: "warnc", off: e.gps_start.dist} : {t: e.gps_start.on_site ? "na stavbe" : "GPS", c: e.gps_start.on_site ? "pos" : "muted"};
  const p = project(e.project_id);
  if (!p || p.lat == null) return {t: "GPS", c: "muted"};
  const d = distM(e.gps_start, p);
  return d <= (p.radius || C.default_radius) ? {t: "na stavbe", c: "pos"} : {t: fmtDist(d) + " od stavby", c: "warnc", off: d};
};
const groupKey = e => e.project_id || "ine:" + (e.other_text || "").trim().toLowerCase();
RENDER.prehlad = async main => {
  const today0 = new Date(); today0.setHours(0, 0, 0, 0);
  const [open, today, budget] = await Promise.all([
    q(sb.from("entries").select("*").eq("company_id", C.id).is("end_at", null).order("start_at")),
    q(sb.from("entries").select("*").eq("company_id", C.id).gte("start_at", today0.toISOString()).order("start_at")),
    loadBudgetUse(), loadMoney()
  ]);
  live = {open, today}; cache.budget = budget; renderNav();
  // nočná zmena: zabudnutý je ten, kto je v práci dlhšie ako limit, nie ten, kto prišiel včera
  const tooLong = e => workedMs(e) > C.max_shift_hours * 36e5;
  const nowOpen = open.filter(e => !tooLong(e));
  const forgotten = open.filter(tooLong);
  const active = W.filter(w => w.active);
  const tk = dateKey(Date.now());
  const absentToday = A.filter(a => a.date_from <= tk && a.date_to >= tk);
  const working = new Set(nowOpen.map(e => e.worker_id));
  const present = new Set(today.concat(open).map(e => e.worker_id));
  const missing = active.filter(w => !present.has(w.id) && !absentToday.some(a => a.worker_id === w.id));
  const leftToday = active.filter(w => present.has(w.id) && !working.has(w.id) && !forgotten.some(e => e.worker_id === w.id));
  const offSite = nowOpen.filter(e => gpsState(e)?.off);
  const editedToday = today.filter(e => e.edited);
  const warnP = P.filter(p => p.active && budgetState(p, budget[p.id] || 0)?.cls);
  const lateCash = CASH.filter(cashLate), toCheck = CASH.filter(c => c.status === "reported"), cs = cashSummary();

  const alerts = [
    ...forgotten.map(e => `<li><b>${esc(wName(e.worker_id))}</b> nemá odchod – v práci ${hhmm(workedMs(e))} h od ${dShort(e.start_at)} ${hm(e.start_at)}. <button class="lnk" data-act="entry" data-id="${e.id}">Opraviť</button></li>`),
    ...offSite.map(e => `<li><b>${esc(wName(e.worker_id))}</b> je mimo okruhu stavby (${gpsState(e).t.replace(" od stavby", "")} od ${esc(projName(e))}).</li>`),
    ...warnP.map(p => { const st = budgetState(p, budget[p.id] || 0); return `<li><b>Rozpočet</b> ${esc(p.name)}: ${Math.round(st.pct)} % ${st.cls === "over" ? "– prekročený" : "minuté"}.</li>`; }),
    ...(editedToday.length ? [`<li><b>${editedToday.length}×</b> dnes upravený čas v mobile. <a href="#dochadzka" data-act="flt-edited">Pozrieť</a></li>`] : []),
    ...(lateCash.length ? [`<li><b>Doklad chýba</b> dlhšie ako ${C.cash_overdue_days} dni: ${[...new Set(lateCash.map(c => wName(c.worker_id)))].map(esc).join(", ")}. <a href="#pokladna">Pokladňa</a></li>`] : []),
    ...(toCheck.length ? [`<li><b>${toCheck.length}×</b> doklad čaká na kontrolu. <a href="#pokladna">Skontrolovať</a></li>`] : [])
  ];
  // zoskupenie podľa zákaziek: najprv tie, kde sa teraz robí
  const groups = new Map();
  nowOpen.forEach(e => { const k = groupKey(e); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
  const order = [...groups.keys()].sort((a, b) => groups.get(b).length - groups.get(a).length);
  const idle = P.filter(p => p.active && !groups.has(p.id));

/* =====================================================================
   VÝKAZY – mesačný súhrn na pracovníka a na zákazku, export
   ===================================================================== */
function workdays(from, to) {      // počet pracovných dní (po–pi) v rozsahu dátumov vrátane
  let n = 0; const d = new Date(from + "T12:00:00"), e = new Date(to + "T12:00:00");
  for (; d <= e; d.setDate(d.getDate() + 1)) if (d.getDay() % 6) n++;
  return n;
}
function absenceDays(wid, ym) {
  const [a, b] = monthRange(ym); const mFrom = dateKey(a), mTo = dateKey(b - 864e5);
  const out = {dovolenka: 0, PN: 0, volno: 0};
  A.filter(x => x.worker_id === wid && x.date_to >= mFrom && x.date_from <= mTo).forEach(x => {
    out[x.kind] += workdays(x.date_from > mFrom ? x.date_from : mFrom, x.date_to < mTo ? x.date_to : mTo);
  });
  return out;
}
function summarize(list, keyFn) {
  const m = new Map();
  list.forEach(e => { const k = keyFn(e); const o = m.get(k) || {ms: 0, cost: 0, n: 0, edited: 0, days: new Set(), items: []};
    o.ms += workedMs(e); o.cost += costOf(e); o.n++; o.edited += e.edited ? 1 : 0; o.days.add(dateKey(e.start_at)); o.items.push(e); m.set(k, o); });
  return m;
}
function reportData(all, pay = {}) {
  const byW = summarize(all, e => e.worker_id), byP = summarize(all, e => e.project_id || "ine");
  const hasMoney = id => { const o = pay[id]; return o && (o.adv || o.cash || o.carry) || cashSummary(id).n; };
  const workers = W.filter(w => w.active || byW.has(w.id) || hasMoney(w.id)).map(w => {
    const s = byW.get(w.id) || {ms: 0, cost: 0, n: 0, edited: 0, days: new Set(), items: []};
    return {w, s, pay: pay[w.id] || {labor: 0, adv: 0, cash: 0, carry: 0, pay: 0}, owed: cashSummary(w.id), abs: w.type === "TPP" ? absenceDays(w.id, flt.month) : null, perP: summarize(s.items, e => e.project_id || "ine")};
  });
  const projects = [...byP.keys()].map(k => ({k, p: k === "ine" ? null : project(k), s: byP.get(k), perW: summarize(byP.get(k).items, e => e.worker_id), perT: summarize(byP.get(k).items, e => e.task_num)}))
    .sort((a, b) => b.s.cost - a.s.cost);
  return {workers, projects};
}

async function saveWorker() {
  const f = $("[data-form=worker]"); const id = f.dataset.id;
  if (!f.wName.value.trim()) return toast("Zadaj meno", true);
  // nepridať toho istého človeka druhýkrát – ponúknuť aktiváciu
  const norm = t => t.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ");
  const twin = !id && W.find(w => norm(w.name) === norm(f.wName.value));
  if (twin) {
    if (!twin.active && confirm(twin.name + " už je v zozname ako neaktívny. Aktivovať ho (so starou sadzbou a históriou) namiesto pridania nového?")) { closeModal(); return activateWorker(twin.id); }
    if (twin.active && !confirm(twin.name + " už v zozname je. Naozaj pridať ďalšieho s rovnakým menom?")) return;
  }
  const row = {name: f.wName.value.trim(), phone: f.wPhone.value.trim() || null, type: f.wType.value,
    hourly_rate: f.wRate.value === "" ? null : +f.wRate.value, active: f.wActive.checked, note: f.wNote.value.trim() || null};
  try {
    let saved;
    if (id) saved = await q(sb.from("workers").update(row).eq("id", id).select().single());
    else saved = await q(sb.from("workers").insert({...row, company_id: C.id}).select().single());
    W = W.filter(w => w.id !== saved.id).concat(saved).sort((a, b) => a.name.localeCompare(b.name, "sk"));
    closeModal(); toast("Uložené");
    go(); if (!id) openInvite(saved.id);
  } catch (e) { toast(errMsg(e), true); }
}

  W = W.map(w => w.id === id ? saved : w); toast(saved.name + " je znova aktívny"); go();
}
// zmazať sa dá len pracovník bez záznamov dochádzky – inak by zmizli z výkazov
async function deleteWorker(id) {
  const used = await q(sb.from("entries").select("id").eq("worker_id", id).limit(1));
  if (used.length || ADV.some(a => a.worker_id === id) || CASH.some(c => c.worker_id === id)) {
    if (!worker(id).active) return toast("Pracovník má záznamy (dochádzka alebo peniaze), preto ostáva ako neaktívny.", true);
    if (!confirm("Pracovník má záznamy dochádzky alebo záloh, preto sa nedá zmazať (zmizli by z výkazov). Označiť ho ako neaktívneho? Nebude sa vedieť prihlásiť a zo zoznamu sa schová.")) return;
    const saved = await q(sb.from("workers").update({active: false}).eq("id", id).select().single());
    W = W.map(w => w.id === id ? saved : w); closeModal(); toast("Pracovník je neaktívny"); go(); return;
  }
  if (!confirm("Naozaj zmazať pracovníka " + worker(id).name + "?")) return;
  await q(sb.from("workers").delete().eq("id", id));
  W = W.filter(w => w.id !== id); A = A.filter(a => a.worker_id !== id); R = R.filter(r => r.worker_id !== id);
  closeModal(); toast("Zmazané"); go();
}

function setPoint(lat, lng) {
  $("#pLat").value = lat; $("#pLng").value = lng;

  else pMarker.setLatLng([lat, lng]);
  if (!pCircle) pCircle = L.circle([lat, lng], {radius: r, color: "#F2B705", weight: 2, fillOpacity: .15}).addTo(pMap);
  else { pCircle.setLatLng([lat, lng]); pCircle.setRadius(r); }
}
async function geocode() {
  const qv = $("#pAddr").value.trim(); if (!qv) return toast("Zadaj adresu", true);

    if (!r.length) return toast("Adresu sa nepodarilo nájsť – klikni do mapy", true);
    setPoint(+r[0].lat, +r[0].lon); pMap.setView([+r[0].lat, +r[0].lon], 17);
  } catch (e) { toast("Vyhľadávanie nefunguje – klikni do mapy", true); }
}

    <div class="muted">${left <= 0 ? `<b class="neg">Rozpočet je prekročený o ${eur(-left)}.</b>` : daysLeft ? `Zostáva ${eur(left)}. Pri terajšom tempe (≈ ${eur(perDay)} za deň) sa minie o ${daysLeft} ${daysLeft === 1 ? "pracovný deň" : daysLeft < 5 ? "pracovné dni" : "pracovných dní"}.` : `Zostáva ${eur(left)}.`}</div>
  </section>` : `<div class="card muted">Zákazka nemá zadaný rozpočet. <button class="btn sm" data-act="project" data-id="${p.id}">Zadať rozpočet</button></div>`}
  <div class="stats">

    <div class="stat"><div class="l">Celkom</div><div class="v num">${Math.round(sumMs(rows) / 36e5)} h</div><div class="small muted">${eur(used)}</div></div>
  </div>

  ${photos.length || notes.length ? `<section class="card" style="display:flex;flex-direction:column;gap:10px"><div class="muted small" style="text-transform:uppercase;letter-spacing:.08em">Dnešné fotky a poznámky</div>

async function fillThumbs(root) {
  const imgs = [...root.querySelectorAll("img[data-path]")]; if (!imgs.length) return;
  try {
    const urls = await q(sb.storage.from("fotky").createSignedUrls([...new Set(imgs.map(i => i.dataset.path))], 3600));
    const m = Object.fromEntries(urls.map(u => [u.path, u.signedUrl]));
    imgs.forEach(i => { if (m[i.dataset.path]) i.src = m[i.dataset.path]; else i.replaceWith(Object.assign(document.createElement("span"), {className: "muted small", textContent: "fotka sa nahráva"})); });
  } catch (e) { console.warn(e); }
}

        if (!confirm(`Strhnúť ${eur(c.given)} z výplaty (${wName(c.worker_id)})? Položka sa uzavrie.`)) return;
        await updCash(id, {status: "done", settle_mode: "payroll", settled_at: new Date().toISOString()}, "Strhne sa z výplaty"); break; }
      case "cash-deduct-w": { const l = CASH.filter(c => c.worker_id === id && c.kind === "issued" && (c.status === "open" || c.status === "returned"));
        const nRep = CASH.filter(c => c.worker_id === id && c.status === "reported").length;
        if (!l.length) return toast("Doklad čaká na kontrolu – vybav ho v Pokladni", true);
        if (!confirm(`Strhnúť z výplaty ${eur(l.reduce((a, c) => a + +c.given, 0))} – hotovosť bez dokladu (${wName(id)})?${nRep ? `\n${nRep}× doklad čaká na kontrolu, ten ostane.` : ""}`)) return;
        // zaúčtuje sa do zobrazeného mesiaca (alebo dnes, ak je mesiac ešte otvorený)
        const at = new Date(Math.min(Date.now(), monthRange(flt.month)[1] - 1)).toISOString();
        for (const c of l) { const saved = await q(sb.from("cash_items").update({status: "done", settle_mode: "payroll", settled_at: at}).eq("id", c.id).select().single()); CASH = CASH.map(x => x.id === c.id ? saved : x); }
        toast("Strhne sa z výplaty"); go(); break; }
      case "cash-del": if (!confirm("Zmazať túto položku? (napr. ak bola zapísaná omylom)")) return;
        await q(sb.from("cash_items").delete().eq("id", id)); CASH = CASH.filter(c => c.id !== id); go(); break;
      case "cash-reopen": { const c = CASH.find(x => x.id === id);
        await updCash(id, {status: c.spent != null ? "reported" : "open", settle_mode: null, settled_at: null}, "Znova otvorené"); break; }
      case "cash-photo": { const u = await q(sb.storage.from("fotky").createSignedUrl(el.dataset.path, 3600)); window.open(u.signedUrl, "_blank", "noopener"); break; }
      case "cash-xlsx": await exportCash(); break;
      case "adv-new": openAdvance(id); break;
      case "adv-save": await saveAdvance(); break;
      case "adv-del": if (!confirm("Zmazať zálohu?")) return;
        await q(sb.from("advances").delete().eq("id", id)); ADV = ADV.filter(a => a.id !== id); openWorker(el.dataset.w); toast("Záloha zmazaná"); break;
    }
  } catch (e) { toast(errMsg(e), true); console.error(e); }
});
document.addEventListener("submit", async ev => {
  ev.preventDefault(); const f = ev.target, k = f.dataset.form;
  try {
    if (k === "login") await doLogin(f);
    else if (k === "signup") await doSignup(f);
    else if (k === "company") await doCreateCompany(f);
    else if (k === "settings") await saveSettings();
    else if (k === "worker") await saveWorker();
    else if (k === "project") await saveProject();
    else if (k === "entry") await saveEntry();
    else if (k === "cash-give") await saveCashGive();
    else if (k === "advance") await saveAdvance();
    else if (k === "task") {
      const row = {company_id: C.id, num: +f.tNum.value, name: f.tName.value.trim()};
      const t = await q(sb.from("tasks").insert(row).select().single()); T = T.concat(t).sort((a, b) => a.num - b.num); go();
    } else if (k === "rate") {
      const row = {company_id: C.id, worker_id: f.rWorker.value || null, project_id: f.rProject.value || null, task_num: f.rTask.value === "" ? null : +f.rTask.value, rate: +f.rRate.value};
      if (!row.project_id && row.task_num == null) return toast("Vyber zákazku alebo úlohu. Sadzbu pracovníka nastavíš v jeho karte.", true);
      const r = await q(sb.from("rates").insert(row).select().single()); R = R.concat(r); go();
    } else if (k === "absence") {
      const row = {company_id: C.id, worker_id: f.dataset.id, kind: f.aKind.value, date_from: f.aFrom.value, date_to: f.aTo.value, note: f.aNote.value.trim() || null};
      if (row.date_to < row.date_from) return toast("Dátum do musí byť po dátume od", true);
      const r = await q(sb.from("absences").insert(row).select().single()); A = [r, ...A]; openWorker(f.dataset.id); toast("Pridané");
    }
  } catch (e) { toast(errMsg(e), true); console.error(e); }
});
document.addEventListener("change", async ev => {
  const t = ev.target;
  if (t.id === "fMonth") { flt.month = t.value || curMonth(); go(); }
  else if (t.id === "fWorker") { flt.worker = t.value; go(); }
  else if (t.id === "fProject") { flt.project = t.value; go(); }
  else if (t.id === "fEdited") { flt.edited = t.checked; go(); }
  else if (t.id === "fInactive") { showInactive = t.checked; go(); }
  else if (t.id === "fCashWorker") { cashFlt.worker = t.value; go(); }
  else if (t.id === "adWorker" || t.id === "adDate") advInfo();
  else if (t.id === "pRadius" && pCircle) pCircle.setRadius(+t.value || C.default_radius);
  else if (t.dataset.taskName) updTask(+t.dataset.taskName, {name: t.value.trim()});
  else if (t.dataset.taskActive) updTask(+t.dataset.taskActive, {active: t.checked});
});

/* =====================================================================
   ŠTART
   ===================================================================== */
async function start() {
  const {data} = await sb.auth.getSession();
  USER = data.session?.user || null;
  if (!USER || USER.is_anonymous) { USER = null; renderAuth(); return; }
  await loadBase();
  if (!C) { renderAuth(); return; }
  $("#auth").hidden = true; $("#shell").hidden = false;
  go(); retention();
}
/* lehoty uchovávania (GDPR): raz denne zmazať staré GPS súradnice a fotky k práci */
async function retention(force) {
  if (!C || !("gps_keep_days" in C)) return;
  const key = "dochadzka.retention." + C.id, today = dateKey(Date.now());
  try { if (!force && localStorage.getItem(key) === today) return; } catch (e) {}
  try {
    await q(sb.rpc("purge_old_gps"));
    const cut = new Date(Date.now() - C.photo_keep_days * 864e5).toISOString();
    const old = (await fetchAll(() => sb.from("entries").select("id,photos").eq("company_id", C.id).lt("start_at", cut).neq("photos", "{}")))
      .filter(e => (e.photos || []).length);
    for (let i = 0; i < old.length; i += 100) {
      const part = old.slice(i, i + 100);
      await q(sb.storage.from("fotky").remove(part.flatMap(e => e.photos)));
      await q(sb.from("entries").update({photos: []}).in("id", part.map(e => e.id)));
    }
    try { localStorage.setItem(key, today); } catch (e) {}
  } catch (e) { console.warn("retention", e); }
}
start().catch(e => { renderAuth({t: errMsg(e), err: true}); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
