<!doctype html><html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1F1D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dochádzka">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>Dochádzka na stavbe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
/* Layout: jedna obrazovka, veľké tlačidlá pre prácu v rukaviciach, dôležité hore, detaily v spodných paneloch */
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --sunk:#F5F6F3; --ink:#1B1F1D; --muted:#5C635E; --line:#D3D7D1;
  --accent:#F2B705; --accent-ink:#1B1F1D; --go:#1E7F4F; --go-ink:#FFFFFF; --stop:#B8322A; --stop-ink:#FFFFFF;
  --flag:#D12A1F; --info:#2F5D8A;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121513; --surface:#1C201D; --sunk:#171A18; --ink:#EEF0EC; --muted:#9AA29C; --line:#2E3430;
  --accent:#F5C02A; --accent-ink:#121513; --go:#2C9A63; --go-ink:#FFFFFF; --stop:#D4483A; --stop-ink:#FFFFFF;
  --flag:#FF5A4E; --info:#7FB0E0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121513; --surface:#1C201D; --sunk:#171A18; --ink:#EEF0EC; --muted:#9AA29C; --line:#2E3430;
  --accent:#F5C02A; --accent-ink:#121513; --go:#2C9A63; --go-ink:#FFFFFF; --stop:#D4483A; --stop-ink:#FFFFFF;
  --flag:#FF5A4E; --info:#7FB0E0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
.byadm{display:inline-flex;align-items:center;gap:4px;color:var(--info);font-weight:600;font-size:14px}
.privacy{display:flex;flex-direction:column;gap:10px}.privacy p{margin:0}.privacy a{color:var(--info)}

/* hlavička */
.top{display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:var(--muted);font-size:14px}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--go)}
.sync.off .dot{background:var(--accent)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

/* odpracované */
.hours{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 2px}
.hours .big{font-family:var(--display);font-weight:700;font-size:56px;line-height:.9;letter-spacing:-.5px}
.hours .big small{font-size:28px;font-weight:600;margin-left:2px;margin-right:8px}
.hours .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.hours .side{text-align:right;color:var(--muted);font-size:14px}
.hours .side b{color:var(--ink);font-weight:600}

/* karty */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.banner{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--accent);background:var(--surface)}
.banner.red{border-color:var(--flag)}
.banner p{margin:0}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}

.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:64px}
.pick .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:6px}
.pick .v{font-size:19px;font-weight:600;line-height:1.2}
.pick .grow{flex:1;min-width:0}
.pick .chg{font-size:14px;font-weight:600;color:var(--info);white-space:nowrap}
.tasknum{font-family:var(--display);font-weight:700;font-size:26px;min-width:46px;height:46px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted);text-transform:none;letter-spacing:0}
.tag.gps{color:var(--go)}
.tag svg{width:12px;height:12px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:15px;display:flex;gap:6px;align-items:center;min-height:40px}
.chip b{font-family:var(--display);font-size:18px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.extras{display:flex;gap:8px}
.extras button{flex:1;min-height:48px;border-radius:12px;border:1px dashed var(--line);background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;color:var(--muted)}
.extras button.has{border-style:solid;color:var(--ink);background:var(--sunk)}
.extras svg{width:20px;height:20px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

.bigbtn{width:100%;min-height:76px;border:0;border-radius:18px;font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.bigbtn:active{transform:translateY(1px)}
.go{background:var(--go);color:var(--go-ink)}
.stop{background:var(--stop);color:var(--stop-ink)}
.secbtn{width:100%;min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:17px}
.secbtn.pause{border:2px solid var(--accent)}
.linkbtn{background:none;border:0;color:var(--info);font-weight:600;padding:8px 0}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* aktuálne v práci */
.now{display:flex;flex-direction:column;gap:12px}
.now .status{display:flex;align-items:center;gap:8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--go);font-weight:600}
.now .status .pulse{width:10px;height:10px;border-radius:50%;background:var(--go);animation:pulse 1.6s infinite}
.now.onbreak .status{color:var(--muted)}
.now.onbreak .status .pulse{background:var(--accent)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--go) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){.now .status .pulse{animation:none}}
.now h2{margin:0;font-size:22px;line-height:1.2;text-wrap:balance}
.now .meta{color:var(--muted);font-size:15px}
.now .since{font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink)}

/* dnešné záznamy */
.sect{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 2px -4px;display:flex;justify-content:space-between;align-items:baseline}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.entry{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.entry:first-child{border-top:0}
.entry .t{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.1}
.entry .t.open{color:var(--go)}
.entry .p{min-width:0}
.entry .p b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .p span{color:var(--muted);font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .d{font-family:var(--display);font-size:18px;font-weight:600;text-align:right}
.edited{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--flag);font-weight:600}
.empty{padding:18px 14px;color:var(--muted);text-align:center}

/* spodný panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;flex:1;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.02em}
.sheet .body{overflow:auto;padding:12px 16px 18px;display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);min-height:58px}
.opt[aria-pressed="true"]{border:2px solid var(--ink)}
.opt .grow{flex:1;min-width:0}
.opt b{display:block;font-weight:600}
.opt span{color:var(--muted);font-size:14px}
.opt .dist{font-size:13px;color:var(--muted);white-space:nowrap}
.opt .dist.in{color:var(--go);font-weight:600}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.keypad button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-family:var(--display);font-weight:700;font-size:24px}
.keypad button.wide{grid-column:span 2;font-family:var(--body);font-size:16px;font-weight:600}
.typed{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bg);min-height:62px}
.typed .tasknum{min-width:56px}
.typed .name{font-size:19px;font-weight:600;flex:1}
.typed .name.none{color:var(--muted);font-weight:400}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field textarea,.field select{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);padding:10px 12px;font-size:18px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input[type=time]{font-family:var(--display);font-size:26px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:var(--muted);font-size:14px;margin:0}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle .grow{flex:1}
.toggle b{display:block;font-weight:600}
.toggle span{color:var(--muted);font-size:14px}
.sw{appearance:none;width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw:checked{background:var(--go)}
.sw:checked::after{left:23px}
.demo{border:2px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.demo h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.day{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.login{display:flex;flex-direction:column;gap:14px;padding-top:6vh}
.login h1{font-family:var(--display);font-size:40px;margin:0;line-height:1}
.codein{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.14em;text-align:center;text-transform:uppercase;min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);width:100%}
.err{color:var(--flag);font-weight:600;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:40;font-weight:600;max-width:90%;text-align:center}
</style>

<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script src="vendor/supabase-2.117.2.js"></script>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

<script>
/* ======================================================================
   DÁTA – štruktúra pripravená na napojenie administrácie / servera.
   company, projects, tasks prídu zo servera; entries sa posielajú cez outbox.
   ====================================================================== */
const DEMO = {
  company:{ name:"Stavby Novák s.r.o.", gpsEnabled:true, breaksEnabled:false, defaultRadius:500, forgotCheckoutHour:18, maxShiftHours:12,
    privacyController:JSON.stringify({name:"Stavby Novák s.r.o.",address:"Hlavná 1, 811 01 Bratislava",ico:"12345678",contact:"kancelaria@stavbynovak.sk"}), privacyUrl:"", gpsKeepDays:90, photoKeepDays:365 },
  worker:{ id:"w1", name:"Peter Kováč", type:"TPP" },   // type: "TPP" | "SZCO" (živnostník)
  projects:[
    { id:"p1", name:"Bytový dom Tomášikova", address:"Tomášikova 12, Bratislava-Ružinov", lat:48.1585, lng:17.1580, radius:500 },
    { id:"p2", name:"Rodinný dom Rovinka", address:"Hlavná 210, Rovinka", lat:48.1003, lng:17.2289, radius:500 },
    { id:"p3", name:"Kancelárie Mlynské nivy", address:"Mlynské nivy 45, Bratislava", lat:48.1448, lng:17.1265, radius:400 },
    { id:"p4", name:"Kúpeľňa Petržalka – Gessayova", address:"Gessayova 8, Bratislava-Petržalka", lat:48.1180, lng:17.1050, radius:300 }
  ],
  tasks:[
    [0,"Nezaradené"],[1,"Príprava pracoviska"],[2,"Doprava materiálu"],[3,"Upratovanie"],[4,"Lešenie"],
    [5,"Búranie"],[6,"Penetrácia"],[7,"Maľovanie"],[8,"Montáž SDK"],[9,"Murovanie"],
    [10,"Omietky"],[11,"Obklady a dlažby"],[12,"Elektroinštalácia"],[13,"Vodoinštalácia"],[14,"Podlahy"],
    [15,"Zatepľovanie"],[16,"Okná a dvere"],[17,"Stierky"],[20,"Strecha"],[30,"Výkopové práce"],
    [40,"Betonáž"],[41,"Armovanie"],[50,"Nákup materiálu"],[99,"Oprava reklamácie"]
  ].map(([num,name])=>({num,name}))
};
/* Server: Supabase (adresa a verejný kľúč v config.js). mode: null = neprihlásený, "live" = ostrá prevádzka, "demo" = ukážka bez servera */
const CFG = window.DOCHADZKA||null;
const sb = (CFG&&window.supabase) ? supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey) : null;
const KEY = "dochadzka.v1";

let S = load();
function freshState(){
  return { mode:"demo", company:DEMO.company, worker:DEMO.worker, projects:DEMO.projects, tasks:DEMO.tasks,
    gpsConsent:null, entries:[], outbox:[], last:{projectId:"p1", taskNum:5, recentTasks:[5,8,7,3]},
    demo:{ offline:false, simLoc:"p2" } };
}
function freshLive(workerId){
  return { mode:"live", workerId, companyId:null, company:{name:"",gpsEnabled:false,breaksEnabled:false,defaultRadius:500,forgotCheckoutHour:18,maxShiftHours:12},
    worker:{id:workerId,name:"",type:"TPP"}, projects:[], tasks:[{num:0,name:"Nezaradené"}],
    gpsConsent:null, entries:[], outbox:[], last:{projectId:null, taskNum:0, recentTasks:[]}, pulledAt:0 };
}
function load(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(s&&s.worker&&!s.mode) s.mode="demo";          // stará verzia appky = ukážka
  if(!s||!s.mode) s={mode:null};
  return s;
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ prunePhotos(0); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e2){ toast("V mobile je málo miesta"); } }
}
// odoslané fotky starších záznamov netreba držať v mobile
function prunePhotos(days){
  const lim=Date.now()-days*864e5;
  S.entries&&S.entries.forEach(e=>{ if(e.start<lim&&e.photoPaths) e.photos=e.photos.map((p,i)=>e.photoPaths[i]?null:p); });
}
function uid(){
  if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
  return "10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^Math.random()*16>>c/4).toString(16));
}
const live=()=>S.mode==="live";
function at(dayOffset,h,m){ const d=new Date(); d.setDate(d.getDate()+dayOffset); d.setHours(h,m,0,0); return d.getTime(); }
function mk(o){ return Object.assign({id:uid(),workerId:S.worker?S.worker.id:"w1",projectId:null,otherText:"",taskNum:0,note:"",photos:[],photoPaths:[],start:0,end:null,
  startOrig:null,endOrig:null,edited:false,byAdmin:false,gpsStart:null,gpsEnd:null,breaks:[],synced:true},o); }
function seed(s){
  // ukážková história, aby bolo vidieť prehľad
  const plan=[[-3,[["p1",5,7,0,15,30]]],[-2,[["p1",8,7,0,11,45],["p3",8,12,15,15,40]]],[-1,[["p2",9,6,45,15,15]]]];
  plan.forEach(([d,segs])=>segs.forEach(([p,t,h1,m1,h2,m2])=>s.entries.push(mk({projectId:p,taskNum:t,start:at(d,h1,m1),end:at(d,h2,m2)}))));
  const y=s.entries[s.entries.length-1]; y.startOrig=y.start; y.start=at(-1,6,30); y.edited=true; y.note="Murovanie priečok 1. NP";
  const n=new Date(); if(n.getHours()*60+n.getMinutes()>10*60+30)
    s.entries.push(mk({projectId:"p1",taskNum:5,note:"Búranie jadra 3. posch.",start:at(0,7,0),end:at(0,10,15)}));
}

/* ======================================================================
   POMOCNÉ
   ====================================================================== */
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm=ts=>{const d=new Date(ts);return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");};
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
const isToday=ts=>dayKey(ts)===dayKey(Date.now());
function dur(ms){ const m=Math.max(0,Math.round(ms/60000)); return {h:Math.floor(m/60),m:m%60}; }
function durTxt(ms){ const {h,m}=dur(ms); return h? `${h} h ${String(m).padStart(2,"0")} min` : `${m} min`; }
function durShort(ms){ const {h,m}=dur(ms); return `${h}:${String(m).padStart(2,"0")}`; }
function worked(e,now=Date.now()){
  const end=e.end??now; let ms=end-e.start;
  e.breaks.forEach(b=>{ ms-=((b.end??now)-b.start); });
  return Math.max(0,ms);
}
const proj=id=>S.projects.find(p=>p.id===id);
const activeProjects=()=>S.projects.filter(p=>p.active!==false);
const activeTasks=()=>S.tasks.filter(t=>t.active!==false);
const hasPos=p=>p&&p.lat!=null&&p.lng!=null;
const task=n=>S.tasks.find(t=>t.num===n);
const projName=e=>e.projectId?(proj(e.projectId)?.name||"?"):("Iné"+(e.otherText?": "+e.otherText:""));
const taskName=n=>{const t=task(n);return t?t.name:"Úloha "+n;};
const openEntry=()=>S.entries.find(e=>e.end===null);
const onBreak=e=>e&&e.breaks.some(b=>b.end===null);
const gpsOn=()=>S.company.gpsEnabled&&S.gpsConsent===true;
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
function distM(a,b){ const R=6371000,r=Math.PI/180; const dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
const fmtDist=m=>m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(1).replace(".",",")+" km";

/* ======================================================================
   POLOHA – skutočné GPS; v náhľade (kde prehliadač polohu blokuje) simulovaná
   ====================================================================== */
let lastPos=null;
function getPos(){
  return new Promise(res=>{
    const sim=()=>{ if(live()) return res(null); const p=proj(S.demo.simLoc); res(p?{lat:p.lat+0.0007,lng:p.lng-0.0005,acc:15,sim:true,t:Date.now()}:{lat:48.20,lng:17.40,acc:30,sim:true,t:Date.now()}); };
    if(!navigator.geolocation) return sim();
    let done=false; const t=setTimeout(()=>{ if(!done){done=true;sim();} },6000);
    try{
      navigator.geolocation.getCurrentPosition(
        p=>{ if(done)return; done=true; clearTimeout(t); res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),t:Date.now()}); },
        ()=>{ if(done)return; done=true; clearTimeout(t); sim(); },
        {enableHighAccuracy:true,timeout:6000,maximumAge:60000});
    }catch(e){ if(!done){done=true;clearTimeout(t);sim();} }
  });
}
function nearest(pos){
  let best=null;
  activeProjects().filter(hasPos).forEach(p=>{ const d=distM(pos,p); if(d<=(p.radius||S.company.defaultRadius)&&(!best||d<best.d)) best={p,d}; });
  return best;
}

let draft=null; // {projectId, otherText, taskNum, note, photos, source:'gps'|'last'|'manual'}
let switching=false;
async function prepareDraft(){
  let pid=S.last.projectId; if(pid&&!activeProjects().some(p=>p.id===pid)) pid=activeProjects()[0]?.id??null;
  draft={projectId:pid,otherText:"",taskNum:task(S.last.taskNum)?S.last.taskNum:0,note:"",photos:[],source:gpsOn()?"locating":"last"};
  render();
  if(gpsOn()){
    lastPos=await getPos();
    const n=lastPos?nearest(lastPos):null;
    if(draft.source==="locating"){
      if(n){ draft.projectId=n.p.id; draft.source="gps"; } else draft.source="nogps";
    }
    render();
  }
}

function queue(e){ e.synced=false; if(!S.outbox.includes(e.id)) S.outbox.push(e.id); save(); sync(); }
function online(){ return navigator.onLine!==false && !(S.demo&&S.demo.offline); }
async function q(p){ const {data,error}=await p; if(error) throw error; return data; }
const iso=v=>v==null?null:new Date(v).toISOString();
const msOf=v=>v==null?null:Date.parse(v);
function toRow(e){
  return { id:e.id, company_id:S.companyId, worker_id:S.workerId, project_id:e.projectId, other_text:e.otherText||"", task_num:e.taskNum,
    note:e.note||"", photos:(e.photoPaths||[]).filter(Boolean), start_at:iso(e.start), end_at:iso(e.end), start_orig:iso(e.startOrig), end_orig:iso(e.endOrig),
    edited:!!e.edited, gps_start:e.gpsStart, gps_end:e.gpsEnd, breaks:e.breaks||[] };
}
function fromRow(r,old){
  return { id:r.id, workerId:r.worker_id, projectId:r.project_id, otherText:r.other_text||"", taskNum:r.task_num, note:r.note||"",
    photos:old?old.photos:[], photoPaths:r.photos||[], start:msOf(r.start_at), end:msOf(r.end_at), startOrig:msOf(r.start_orig), endOrig:msOf(r.end_orig),
    edited:r.edited, byAdmin:!!r.by_admin, gpsStart:r.gps_start, gpsEnd:r.gps_end, breaks:r.breaks||[], synced:true };
}
async function uploadPhotos(e){
  e.photoPaths=e.photoPaths||[];
  for(let i=0;i<e.photos.length;i++){
    if(e.photoPaths[i]||!e.photos[i]) continue;
    const path=`${S.companyId}/${S.workerId}/${e.id}/${i}-${Date.now().toString(36)}.jpg`;
    const blob=await (await fetch(e.photos[i])).blob();
    const {error}=await sb.storage.from("fotky").upload(path,blob,{contentType:"image/jpeg",upsert:false});
    if(error&&!/exists|Duplicate/i.test(error.message)) throw error;
    e.photoPaths[i]=path; save();
  }
}
let syncing=false, lastErr="";
async function sync(){
  if(syncing) return;
  if(!online()||!S.outbox.length||(live()&&!sb)){ renderSync(); return; }
  syncing=true; renderSync();
  const batch=S.outbox.map(id=>S.entries.find(e=>e.id===id)).filter(Boolean);
  try{
    if(live()){
      for(const e of batch) await uploadPhotos(e);
      await q(sb.from("entries").upsert(batch.map(toRow)));
    }
    batch.forEach(e=>e.synced=true); S.outbox=S.outbox.filter(id=>!batch.some(e=>e.id===id)); lastErr=""; save();
  }catch(err){ lastErr=String(err&&err.message||err); console.warn("sync",err); }
  syncing=false; renderSync();
}
// stiahne nastavenia firmy, zákazky, úlohy a vlastné záznamy (napr. opravy od zamestnávateľa)
async function pull(){
  if(!live()||!sb||!online()) return;
  try{
    const me=await q(sb.from("workers").select("id,name,type,gps_consent,company_id").eq("id",S.workerId));
    if(!me.length){ S.loggedOut=true; save(); render(); return; }
    const w=me[0]; S.loggedOut=false;
    const since=new Date(Date.now()-40*864e5).toISOString();
    const [c,ps,ts,es,cash]=await Promise.all([
      q(sb.from("companies").select("*").eq("id",w.company_id).single()),
      q(sb.from("projects").select("id,name,address,lat,lng,radius,active").eq("company_id",w.company_id).order("name")),
      q(sb.from("tasks").select("num,name,active").eq("company_id",w.company_id).order("num")),
      q(sb.from("entries").select("*").eq("worker_id",w.id).gte("start_at",since).order("start_at")),
      q(sb.from("cash_items").select("*").eq("worker_id",w.id).neq("status","done").order("issued_at")).catch(()=>S.cash||[])
    ]);
    S.cash=cash;
    S.companyId=w.company_id; S.worker={id:w.id,name:w.name,type:w.type};
    if(S.gpsConsent===null||w.gps_consent!==null) S.gpsConsent=w.gps_consent;
    S.company={name:c.name,gpsEnabled:c.gps_enabled,breaksEnabled:c.breaks_enabled,defaultRadius:c.default_radius,forgotCheckoutHour:c.forgot_checkout_hour,maxShiftHours:c.max_shift_hours,
      privacyController:c.privacy_controller||"",privacyUrl:c.privacy_url||"",gpsKeepDays:c.gps_keep_days??null,photoKeepDays:c.photo_keep_days??null};
    S.projects=ps.map(p=>({...p,address:p.address||""})); S.tasks=ts.length?ts:[{num:0,name:"Nezaradené"}];
    const byId=new Map(S.entries.map(e=>[e.id,e])), seen=new Set();
    es.forEach(r=>{ seen.add(r.id); if(S.outbox.includes(r.id)) return; byId.set(r.id,fromRow(r,byId.get(r.id))); });
    // záznamy, ktoré zamestnávateľ zmazal
    const lim=Date.parse(since);
    byId.forEach((e,id)=>{ if(!seen.has(id)&&!S.outbox.includes(id)&&e.start>=lim) byId.delete(id); });
    S.entries=[...byId.values()].sort((a,b)=>a.start-b.start);
    S.pulledAt=Date.now(); prunePhotos(3); save();
    if(!openEntry()&&!switching) draft=null;
    render();
  }catch(err){ console.warn("pull",err); }
}

/* prihlásenie kódom od zamestnávateľa */
let loginErr="", loginBusy=false;
async function claim(code){
  if(!sb){ loginErr="Appka nemá nastavený server."; render(); return; }
  loginBusy=true; loginErr=""; render();
  try{
    const {data}=await sb.auth.getSession();
    if(!data.session) await q(sb.auth.signInAnonymously());
    const wid=await q(sb.rpc("claim_invite",{p_code:code}));
    const keep=(live()&&S.workerId===wid)?S:null;   // ten istý pracovník – neodoslané záznamy ostávajú
    S=keep||freshLive(wid); S.loggedOut=false; save();
    draft=null; switching=false;
    await pull(); sync();
    toast("Prihlásený: "+S.worker.name);
  }catch(e){
    const m=String(e&&e.message||e);
    loginErr=/Neplatný kód/.test(m)?"Kód nesedí. Skontroluj ho alebo si vypýtaj nový.":/anonymous/i.test(m)?"Server nemá povolené prihlásenie pracovníkov (Anonymous sign-ins). Daj vedieť zamestnávateľovi.":/fetch|network/i.test(m)?"Bez pripojenia na internet. Skús to znova so signálom.":m;
  }
  loginBusy=false; render();
}
function loginHtml(){
  return `<div class="login">
    <h1>Dochádzka</h1>
    ${S.loggedOut?`<p class="err">Zamestnávateľ ťa z tohto mobilu odhlásil. Zadaj nový kód.</p>`:""}
    <p style="margin:0">Zadaj kód, ktorý ti poslal zamestnávateľ. Stačí raz, potom ostaneš prihlásený.</p>
    <input class="codein" id="codeIn" maxlength="9" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="ABCD-1234" aria-label="Kód od zamestnávateľa" value="${esc(pendingCode)}">
    ${loginErr?`<p class="err">${esc(loginErr)}</p>`:""}
    <button class="bigbtn go" data-act="claim" ${loginBusy?"disabled":""}>${loginBusy?"Prihlasujem…":"Prihlásiť"}</button>
    ${S.mode!=="live"?`<button class="secbtn" data-act="demo">Len vyskúšať (ukážka bez servera)</button>`:""}
  </div>`;
}
let pendingCode="";
async function checkIn(){
  if(draft.projectId===null && !draft.otherText.trim()){ openProjectSheet(true); return; }
  const now=Date.now();
  // poloha sa ukladá len pri Príchode – čerstvá (nie staršia ako 2 min. z otvorenia appky)
  let pos=null; if(gpsOn()) pos=(lastPos&&now-(lastPos.t||0)<120000)?lastPos:await getPos();
  const cur=openEntry();
  if(cur){ closeEntry(cur,now); }
  const e=mk({projectId:draft.projectId,otherText:draft.otherText.trim(),taskNum:draft.taskNum,note:draft.note.trim(),photos:draft.photos,start:now,
    gpsStart:pos?{lat:pos.lat,lng:pos.lng,acc:pos.acc,auto:draft.source==="gps",sim:!!pos.sim}:null});
  S.entries.push(e);
  S.last.projectId=draft.projectId; S.last.taskNum=draft.taskNum;
  S.last.recentTasks=[draft.taskNum,...S.last.recentTasks.filter(n=>n!==draft.taskNum)].slice(0,4);
  queue(e); switching=false; draft=null; reminderDismissed=false;
  toast(cur?"Presun zapísaný, príchod "+hm(now):"Príchod "+hm(now));
  render();
}
function closeEntry(e,ts){
  e.breaks.forEach(b=>{ if(b.end===null) b.end=ts; });
  e.end=ts;   // pri Odchode sa poloha neukladá
  queue(e);
}
async function checkOut(){
  const e=openEntry(); if(!e) return;
  closeEntry(e,Date.now()); switching=false;
  toast("Odchod "+hm(e.end)+" · dnes spolu "+durTxt(todayMs()));
  render(); prepareDraft();
}
function toggleBreak(){
  const e=openEntry(); if(!e) return;
  const b=e.breaks.find(b=>b.end===null);
  if(b){ b.end=Date.now(); toast("Pokračuješ v práci"); } else { e.breaks.push({start:Date.now(),end:null}); toast("Prestávka od "+hm(Date.now())); }
  queue(e); render();
}
function todayMs(){ return S.entries.filter(e=>isToday(e.start)||e.end===null).reduce((a,e)=>a+worked(e),0); }

let cashBusy=false;
async function sendCash(){
  keepCashFields(); const d=cashDraft, amt=Math.round(parseFloat(String(d.spent).replace(",","."))*100)/100;
  if(!(amt>=0)||d.spent===""){ toast("Zadaj, koľko si minul"); return; }
  if(d.kind==="own"&&!(amt>0)){ toast("Zadaj sumu"); return; }
  if(!d.photos.length&&!confirm("Bez fotky bločku? Zamestnávateľ ho môže vrátiť.")) return;
  if(!online()){ toast("Bez signálu – odošli, keď budeš mať internet"); return; }
  cashBusy=true; openCashSheet(d.kind==="own"?null:d.id);
  try{
    const paths=[];
    for(let i=0;i<d.photos.length;i++){
      const path=`${S.companyId}/${S.workerId}/cash-${d.id}/${i}-${Date.now().toString(36)}.jpg`;
      const blob=await (await fetch(d.photos[i])).blob();
      const {error}=await sb.storage.from("fotky").upload(path,blob,{contentType:"image/jpeg",upsert:false});
      if(error) throw error; paths.push(path);
    }
    if(d.kind==="own") await q(sb.rpc("add_own_purchase",{p_id:d.id,p_spent:amt,p_purpose:(d.purpose||"").trim(),p_photos:paths,p_note:(d.note||"").trim()}));
    else await q(sb.rpc("report_cash",{p_id:d.id,p_spent:amt,p_photos:paths,p_note:(d.note||"").trim()}));
    cashDraft=null; cashBusy=false; closeSheet(); toast("Odoslané zamestnávateľovi"); await pull();
  }catch(err){ cashBusy=false; toast("Nepodarilo sa odoslať: "+(err&&err.message||err)); openCashSheet(d.kind==="own"?null:d.id); }
}

function saveEdit(){
  const e=S.entries.find(x=>x.id===editId); if(!e) return;
  const v1=$("#tStart").value, v2=$("#tEnd").value;
  const base=new Date(e.start); const mkTs=v=>{const [h,m]=v.split(":").map(Number);const d=new Date(base);d.setHours(h,m,0,0);return d.getTime();};
  let ns=v1?mkTs(v1):e.start, ne=v2?mkTs(v2):e.end;
  if(ne!==null&&v2&&ne<=ns) ne+=864e5;   // odchod po polnoci (nočná zmena)
  if(ne!==null&&ne<=ns){ toast("Odchod musí byť po príchode"); return; }
  if(ne!==null&&ne>Date.now()+60000){ toast("Odchod nemôže byť v budúcnosti"); return; }
  let ch=false;
  if(Math.abs(ns-e.start)>=60000){ if(e.startOrig==null) e.startOrig=e.start; e.start=ns; ch=true; }
  if(ne!==e.end && !(ne!==null&&e.end!==null&&Math.abs(ne-e.end)<60000)){
    if(e.end!==null&&e.endOrig==null) e.endOrig=e.end;
    if(e.end===null&&ne!==null) e.endOrig=Date.now();   // odchod zadaný ručne – pôvodný = kedy ho zadal
    e.end=ne; ch=true; e.breaks.forEach(b=>{ if(b.end===null&&ne!==null) b.end=ne; });
  }
  if(ch){ e.edited=true; queue(e); toast("Čas upravený"); }
  closeSheet(); render(); if(!openEntry()&&!draft) prepareDraft();
}

let photoTarget=null;
$("#photoInput").addEventListener("change",ev=>{
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
  const img=new Image(); const url=URL.createObjectURL(f);
  img.onload=()=>{
    const k=Math.min(1,1024/Math.max(img.width,img.height)); const c=document.createElement("canvas");
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const data=c.toDataURL("image/jpeg",0.6); URL.revokeObjectURL(url);
    if(photoTarget==="cash"){ if(cashDraft){ cashDraft.photos.push(data); openCashSheet(cashDraft.kind==="own"?null:cashDraft.id); } return; }
    if(photoTarget==="cur"){ const e=openEntry(); if(e){ e.photos.push(data); queue(e); } } else if(draft) draft.photos.push(data);
    toast("Fotka pridaná"); render();
  };
  img.onerror=()=>toast("Fotku sa nepodarilo načítať");
  img.src=url;
});

document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="close-sheet"){ if(ev.target===el||el.tagName==="BUTTON") closeSheet(); return; }
  ev.stopPropagation();
  switch(a){
    case "checkin": checkIn(); break;
    case "checkout": checkOut(); break;
    case "break": toggleBreak(); break;
    case "switch": switching=true; prepareDraft(); break;
    case "cancel-switch": switching=false; draft=null; render(); break;
    case "pick-project": openProjectSheet(); break;
    case "set-project": draft.projectId=el.dataset.id; draft.otherText=""; draft.source="manual"; closeSheet(); render(); break;
    case "set-other": { const v=$("#otherText").value.trim(); if(!v){ toast("Napíš, kde alebo čo robíš"); $("#otherText").focus(); return; } draft.projectId=null; draft.otherText=v; draft.source="manual"; closeSheet(); render(); break; }
    case "pick-task": openTaskSheet(); break;
    case "quick-task": draft.taskNum=+el.dataset.n; render(); break;
    case "set-task": draft.taskNum=+el.dataset.n; closeSheet(); render(); break;
    case "key": { const k=el.dataset.k;
      if(k==="del") typed=typed.slice(0,-1);
      else if(k==="ok"){ if(typed!==""&&activeTasks().some(t=>t.num===+typed)){ draft.taskNum=+typed; closeSheet(); render(); } else toast("Zadaj platné číslo úlohy"); return; }
      else typed=(typed.length>=2?"":typed)+k;
      if(typed.length===2&&activeTasks().some(t=>t.num===+typed)){ draft.taskNum=+typed; renderTyped(); setTimeout(()=>{closeSheet();render();},250); return; }
      renderTyped(); break; }
    case "note-draft": openNoteSheet("draft"); break;
    case "note-cur": openNoteSheet("cur"); break;
    case "save-note": { const v=$("#noteText").value; if(el.dataset.t==="cur"){ const e=openEntry(); e.note=v.trim(); queue(e); } else draft.note=v; closeSheet(); render(); break; }
    case "photo-draft": photoTarget="draft"; $("#photoInput").click(); break;
    case "photo-cur": photoTarget="cur"; $("#photoInput").click(); break;
    case "edit": openEditSheet(el.dataset.id); break;
    case "save-edit": saveEdit(); break;
    case "dismiss": reminderDismissed=true; render(); break;
    case "consent-yes": S.gpsConsent=true; save(); sendConsent(); prepareDraft(); break;
    case "consent-no": S.gpsConsent=false; save(); sendConsent(); render(); break;
    case "claim": { const v=$("#codeIn").value; pendingCode=v; if(v.replace(/[^a-z0-9]/gi,"").length!==8){ loginErr="Kód má 8 znakov."; render(); return; } claim(v); break; }
    case "demo": S=freshState(); seed(S); save(); draft=null; render(); break;
    case "to-login": closeSheet(); S={mode:null}; save(); draft=null; render(); break;
    case "refresh": closeSheet(); pull().then(sync); toast("Aktualizujem…"); break;
    case "logout": if(S.outbox.length&&!confirm("V mobile sú neodoslané záznamy ("+S.outbox.length+"). Po odhlásení sa stratia. Odhlásiť?")) return;
      closeSheet(); if(sb) sb.auth.signOut().catch(()=>{}); S={mode:null}; save(); draft=null; render(); break;
    case "settings": openSettings(); break;
    case "privacy": openPrivacy(); break;
    case "cash-report": openCashSheet(el.dataset.id); break;
    case "own-buy": if(!online()){ toast("Funguje len so signálom"); return; } openCashSheet(null); break;
    case "cash-photo": keepCashFields(); photoTarget="cash"; $("#photoInput").click(); break;
    case "cash-send": sendCash(); break;
    case "history": openHistory(); break;
    case "reset": try{localStorage.removeItem(KEY);}catch(e){} S=freshState(); draft=null; switching=false; closeSheet(); render(); toast("Začínaš odznova"); break;
  }
});
document.addEventListener("change",ev=>{
  const id=ev.target.id;
  if(id==="swConsent"){ S.gpsConsent=ev.target.checked; sendConsent(); }
  else if(id==="codeIn"){ pendingCode=ev.target.value; return; }
  else if(id==="swGps"){ S.company={...S.company,gpsEnabled:ev.target.checked}; if(ev.target.checked) S.gpsConsent=null; }
  else if(id==="swBreak"){ S.company={...S.company,breaksEnabled:ev.target.checked}; }
  else if(id==="selType"){ S.worker={...S.worker,type:ev.target.value}; }
  else if(id==="selLoc"){ S.demo.simLoc=ev.target.value; lastPos=null; }
  else if(id==="swOff"){ S.demo.offline=ev.target.checked; }
  else return;
  save(); if(!openEntry()||switching){ draft=null; } render(); sync();
});
function sendConsent(){ if(live()&&sb) sb.rpc("set_gps_consent",{p_consent:S.gpsConsent}).then(({error})=>error&&console.warn(error)); }
document.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&ev.target.id==="codeIn"){ ev.preventDefault(); $("[data-act=claim]").click(); } });
window.addEventListener("online",()=>{ sync(); pull(); }); window.addEventListener("offline",renderSync);
setInterval(()=>{ if(!S.mode) return; if(!$("#sheetRoot").innerHTML) render(); sync(); },20000);
setInterval(()=>{ if(live()&&!document.hidden) pull(); },5*60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&S.mode){ render(); pull().then(sync); } });

// odkaz od zamestnávateľa: ...?kod=ABCD1234
const urlCode=new URLSearchParams(location.search).get("kod");
if(urlCode){ history.replaceState(null,"",location.pathname); pendingCode=urlCode; }
render();
if(urlCode&&sb) claim(urlCode);
else if(live()){ pull().then(sync); }
if("serviceWorker" in navigator && location.protocol==="https:" && !/claude|anthropic/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
